<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>Dynamic Multiplication Table</title>

        <!-- style sheets -->
        <link rel="stylesheet" href="jquery-ui-1.14.2.custom/jquery-ui-1.14.2.custom/jquery-ui.css">
        <link rel="stylesheet" href="css/style.css">

        <!-- jQuery CDN -->
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
        
    </head>
    <body>
        <h1>Dynamic Multiplication Table</h1>

        <!-- tabs -->
        <div id="tabs">
            <ul>
                <li id="formTab"><a href="#Form"><span>Form</span></a></li>
            </ul>

            <!-- tab contents  -->
            <div id="Form">
                <h2>Please enter the table ranges.</h2>
                <h3>Press "Save" to save the table.</h3>
                <h3>Hold "Ctrl" or "Command" to select multiple tabs,</h3>
                <h3>Then press "Delete" to delete yellow-selected tabs.</h3>
                <!-- form -->
                <form id="formID">
                    <div class="form-row">
                        <label for="mincolval">Minimum Column Value:</label>
                        <input type="text" id="mincolval" name="mincolval" 
                            required autofocus><br>
                    </div>

                    <div class="slider" id="slider-mincolval"></div>

                    <div class="form-row">
                        <label for="maxcolval">Maximum Column Value:</label>
                        <input type="text" id="maxcolval" name="maxcolval" 
                            required><br>
                    </div>

                    <div class="slider" id="slider-maxcolval"></div>

                    <div class="form-row">
                        <label for="minrowval">Minimum Row Value:</label>
                        <input type="text" id="minrowval" name="minrowval" 
                            required><br>
                    </div>

                    <div class="slider" id="slider-minrowval"></div>
                    
                    <div class="form-row">
                        <label for="maxrowval">Maximum Row Value:</label>
                        <input type="text" id="maxrowval" name="maxrowval" 
                            required><br>
                    </div>

                    <div class="slider" id="slider-maxrowval"></div>

                    <input type="submit" id="submit-btn" value="Submit">

                    <input type="button" id="save-btn" value="Save">
                    <!-- <input type="reset" value="Reset"><br> -->
                </form>

            </div>
            
        </div>

        <input type="button" id="delete-btn" value="Delete">

        <!-- dynamically created table container -->
        <div id="Table-container">
            
        </div>

        <!-- scripts -->
        <!-- jQuery -->
        <!-- dependent on 'jquery-validation-1.19.5' directory -->
        <script src="jquery-validation-1.19.5/dist/jquery.validate.js"></script> 
        <script src="jquery-validation-1.19.5/dist/additional-methods.js"></script>
        <!-- dependent on 'jquery-ui-1.14.2.custom'directory -->
         <script src="jquery-ui-1.14.2.custom/jquery-ui-1.14.2.custom/jquery-ui.js"></script>
        <!-- JavaScript -->
        <script src="js/script_jquery.js"></script>

    </body>
</html>
